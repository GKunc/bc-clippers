<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BC Clippers mark: white heavy capitals with a dark ring and silver edge on black, like the logo. -->
  <rect width="64" height="64" rx="12" fill="#0b0b0b"/>
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <text x="32" y="45" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="34" fill="#ffffff" stroke="#0b0b0b" stroke-width="1" paint-order="stroke" letter-spacing="1">BC</text>
</svg>
